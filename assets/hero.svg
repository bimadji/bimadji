<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bima Adji Kusuma, computer engineering student di PENS, fokus backend development dengan latar belakang computer vision dan robot soccer">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061519"/>
      <stop offset="52%" stop-color="#0B2429"/>
      <stop offset="100%" stop-color="#051216"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D2329"/>
      <stop offset="100%" stop-color="#08171B"/>
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02080A" flood-opacity="0.52"/>
    </filter>
    <style>
      .s   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .m   { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .name{ font-size: 56px; font-weight: 800; fill: #ECFDF5; letter-spacing: -1px; }
      .role{ font-size: 15px; fill: #D5F5EE; }
      .sub { font-size: 13px; fill: #88B8B2; }
      .lab { font-size: 10.5px; letter-spacing: 2px; fill: #5EEAD4; }
      .val { font-size: 13px; fill: #ECFDF5; }
      .tag { font-size: 11.5px; fill: #88B8B2; }
      .foot{ font-size: 10.5px; letter-spacing: 2px; fill: #67A8A1; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#stage)"/>
  <ellipse cx="280" cy="180" rx="340" ry="180" fill="url(#auroraGlow)"/>
  <ellipse cx="960" cy="240" rx="260" ry="150" fill="url(#auroraGlow)"/>

  <!-- portrait window -->
  <g filter="url(#lift)">
    <rect x="64" y="48" width="600" height="272" rx="14" fill="url(#screen)" stroke="#2DD4BF" stroke-opacity="0.22"/>
    <rect x="64" y="48" width="600" height="34" rx="14" fill="#102B31"/>
    <rect x="64" y="70" width="600" height="12" fill="#102B31"/>
    <line x1="64" y1="82" x2="664" y2="82" stroke="#2DD4BF" stroke-opacity="0.16"/>
    <circle cx="84" cy="65" r="4.5" fill="#0F766E"/>
    <circle cx="100" cy="65" r="4.5" fill="#14B8A6"/>
    <circle cx="116" cy="65" r="4.5" fill="#5EEAD4"/>
    <text class="m" x="134" y="69" font-size="11" fill="#88B8B2">bimadji &#183; profile</text>
    <rect x="584" y="54" width="64" height="20" rx="10" fill="#0D3B38" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <text class="m" x="616" y="68" text-anchor="middle" font-size="9" letter-spacing="1" fill="#5EEAD4">BACKEND</text>
  </g>

  <text class="m lab" x="88" y="112">COMPUTER ENGINEERING &#183; PENS</text>
  <text class="s name" x="86" y="178">Bima Adji</text>
  <text class="s name" x="86" y="240">Kusuma</text>
  <rect x="88" y="256" width="72" height="3" rx="1.5" fill="#2DD4BF"/>
  <text class="s role" x="88" y="288">Backend development, with a robotics vision background</text>

  <!-- avatar tile -->
  <g filter="url(#lift)">
    <rect x="700" y="48" width="204" height="272" rx="14" fill="url(#screen)" stroke="#2DD4BF" stroke-opacity="0.22"/>
  </g>
  <rect x="760" y="96" width="84" height="84" rx="42" fill="#0D3B38" stroke="#2DD4BF" stroke-opacity="0.6"/>
  <text class="s" x="802" y="152" text-anchor="middle" font-size="34" font-weight="700" fill="#5EEAD4">B</text>
  <text class="s val" x="802" y="212" text-anchor="middle" font-size="14" font-weight="700">Bima Adji Kusuma</text>
  <text class="m" x="802" y="232" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#88B8B2">@BIMADJI</text>
  <line x1="732" y1="252" x2="872" y2="252" stroke="#5EEAD4" stroke-opacity="0.14"/>
  <text class="s tag" x="802" y="272" text-anchor="middle">Indonesia</text>
  <text class="s" x="802" y="294" text-anchor="middle" font-size="11.5" fill="#2DD4BF">github.com/bimadji</text>

  <!-- facts rail -->
  <g filter="url(#lift)">
    <rect x="932" y="48" width="204" height="272" rx="14" fill="url(#screen)" stroke="#2DD4BF" stroke-opacity="0.22"/>
  </g>
  <text class="m lab" x="956" y="86">FOCUS</text>
  <text class="s val" x="956" y="108">Backend systems</text>
  <text class="s sub" x="956" y="126">vision &amp; robotics</text>
  <line x1="956" y1="146" x2="1112" y2="146" stroke="#5EEAD4" stroke-opacity="0.14"/>
  <text class="m lab" x="956" y="172">STACK</text>
  <text class="s val" x="956" y="194">Python &#183; FastAPI</text>
  <text class="s val" x="956" y="214">Postgres &#183; C++</text>
  <line x1="956" y1="234" x2="1112" y2="234" stroke="#5EEAD4" stroke-opacity="0.14"/>
  <text class="m lab" x="956" y="260">RECENT</text>
  <text class="s val" x="956" y="282">pos-app</text>
  <text class="s val" x="956" y="302">LabManage</text>

  <text class="m foot" x="64" y="362">SURABAYA, INDONESIA</text>
  <text class="m foot" x="1136" y="362" text-anchor="end">BIMAADJIKUSUMA@GMAIL.COM</text>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#2DD4BF" stroke-opacity="0.38"/>
</svg>
