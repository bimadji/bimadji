<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ilustrasi pos-app-flutter: layar pesanan customer dan dashboard kasir">
  <defs>
    <style>
      .mono { font-family: "Courier New", Courier, monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .num  { font-size: 11px; letter-spacing: 3px; fill: #9a8f77; }
      .hdr  { font-size: 11px; letter-spacing: 2px; fill: #9a8f77; }
      .item { font-size: 12.5px; fill: #1b1813; }
      .muted{ font-size: 11.5px; fill: #6b6252; }
      .big  { font-size: 26px; font-weight: 700; fill: #1b1813; }
      .val  { font-size: 12.5px; fill: #2b2519; }
      .chip { font-size: 10.5px; fill: #1f8a4c; }
      .chip2{ font-size: 10.5px; fill: #b45309; }
      .chip3{ font-size: 10.5px; fill: #1d4ed8; }
      .light{ font-size: 12px; fill: #ffffff; }
      .dark { font-size: 12px; fill: #0f1311; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="14" fill="#f6f1e6"/>

  <text class="mono num" x="48" y="48">01 / REALTIME POS</text>

  <!-- phone -->
  <rect x="64" y="76" width="260" height="236" rx="24" fill="#fffdf8" stroke="#d9cfb8" stroke-width="1.5"/>
  <rect x="76" y="88" width="236" height="212" rx="14" fill="#ffffff" stroke="#eee6d4"/>
  <path d="M76 102 a14 14 0 0 1 14 -14 h208 a14 14 0 0 1 14 14 v30 h-236 z" fill="#27AE60"/>
  <text class="sans light" x="92" y="118" font-weight="700">Meja 05 &#183; Budi</text>
  <text class="sans item" x="92" y="150">Nasi Goreng &#215;2</text>
    <text class="sans muted" x="296" y="150" text-anchor="end">Rp30.000</text>
<text class="sans item" x="92" y="182">Es Teh &#215;2</text>
    <text class="sans muted" x="296" y="182" text-anchor="end">Rp10.000</text>
<text class="sans item" x="92" y="214">Keripik</text>
    <text class="sans muted" x="296" y="214" text-anchor="end">Rp4.000</text>
  <line x1="92" y1="236" x2="296" y2="236" stroke="#eee6d4"/>
  <text class="sans item" x="92" y="258" font-weight="700">Total</text>
  <text class="sans item" x="296" y="258" text-anchor="end" font-weight="700">Rp44.000</text>
  <rect x="92" y="270" width="204" height="26" rx="8" fill="#27AE60"/>
  <text class="sans light" x="194" y="287" text-anchor="middle">Kirim ke kasir</text>

  <!-- kasir dashboard -->
  <rect x="404" y="76" width="732" height="236" rx="14" fill="#fffdf8" stroke="#d9cfb8"/>
  <text class="mono hdr" x="428" y="104">KASIR &#183; PESANAN MASUK</text>
  
    <rect x="428" y="118" width="684" height="52" rx="10" fill="#ffffff" stroke="#eee6d4"/>
    <text class="sans item" x="448" y="140">Meja 05</text>
    <text class="sans muted" x="448" y="157">Rp44.000 &#183; 2 item</text>
    <rect x="1000" y="132" width="96" height="24" rx="12" fill="#fdf1dd" stroke="#e8cfa4"/>
    <text class="sans chip2" x="1048" y="148" text-anchor="middle">menunggu</text>

    <rect x="428" y="180" width="684" height="52" rx="10" fill="#ffffff" stroke="#eee6d4"/>
    <text class="sans item" x="448" y="202">Meja 02</text>
    <text class="sans muted" x="448" y="219">Rp26.000 &#183; 1 item</text>
    <rect x="1000" y="194" width="96" height="24" rx="12" fill="#e8effd" stroke="#c9d8f7"/>
    <text class="sans chip3" x="1048" y="210" text-anchor="middle">diproses</text>

    <rect x="428" y="242" width="684" height="52" rx="10" fill="#ffffff" stroke="#eee6d4"/>
    <text class="sans item" x="448" y="264">Meja 07</text>
    <text class="sans muted" x="448" y="281">Rp61.000 &#183; 4 item</text>
    <rect x="1000" y="256" width="96" height="24" rx="12" fill="#e8f5ec" stroke="#bfe3cd"/>
    <text class="sans chip" x="1048" y="272" text-anchor="middle">selesai</text>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="13.5" fill="none" stroke="#ddd3bd"/>
</svg>
