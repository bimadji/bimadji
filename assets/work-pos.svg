    <rect x="404" y="64" width="724" height="34" rx="14" fill="#181e21"/>
    <rect x="404" y="86" width="724" height="12" fill="#181e21"/>
    <line x1="404" y1="98" x2="1128" y2="98" stroke="#000000" stroke-opacity="0.5"/>
    <circle cx="424" cy="81" r="4.5" fill="#e06c5f"/>
    <circle cx="440" cy="81" r="4.5" fill="#d9a441"/>
    <circle cx="456" cy="81" r="4.5" fill="#4fa86b"/>
    <text class="m" x="474" y="85" font-size="11" fill="#8b969b">pos &#183; pesanan masuk</text>
    <text class="m" x="1108" y="85" font-size="10.5" letter-spacing="1.4" fill="#7d8a84" text-anchor="end">LIVE</text>
  </g>
  <text class="m" x="436" y="120" font-size="10.5" letter-spacing="1.6" fill="#7d8a84">MEJA</text>
  <text class="m" x="536" y="120" font-size="10.5" letter-spacing="1.6" fill="#7d8a84">ITEM</text>
  <text class="m" x="782" y="120" font-size="10.5" letter-spacing="1.6" fill="#7d8a84" text-anchor="end">TOTAL</text>
  <text class="m" x="900" y="120" font-size="10.5" letter-spacing="1.6" fill="#7d8a84" text-anchor="end">WAKTU</text>
  <text class="m" x="1084" y="120" font-size="10.5" letter-spacing="1.6" fill="#7d8a84" text-anchor="end">STATUS</text>
  
    <rect x="416" y="138" width="692" height="42" rx="9" fill="#171d20" stroke="#ffffff" stroke-opacity="0.05"/>
