    <text class="s" x="536" y="164" font-size="12.5" fill="#93a09a">3 item</text>
    <text class="s" x="782" y="164" text-anchor="end" font-size="13.5" fill="#dfe7e2">Rp44.000</text>
    <text class="m" x="900" y="164" text-anchor="end" font-size="11" fill="#7d8a84">12:04</text>
    
    <rect x="1000" y="147" width="88" height="24" rx="12" fill="#3b2f1c" stroke="#6b5527"/>
    <text class="s" x="1044.0" y="163.5" text-anchor="middle" font-size="11" font-weight="600" fill="#f2c078">menunggu</text>
    <rect x="416" y="188" width="692" height="42" rx="9" fill="#171d20" stroke="#ffffff" stroke-opacity="0.05"/>
    <text class="s" x="436" y="214" font-size="13.5" fill="#e9efeb">Meja 02</text>
    <text class="s" x="536" y="214" font-size="12.5" fill="#93a09a">1 item</text>
    <text class="s" x="782" y="214" text-anchor="end" font-size="13.5" fill="#dfe7e2">Rp26.000</text>
    <text class="m" x="900" y="214" text-anchor="end" font-size="11" fill="#7d8a84">12:01</text>
    
    <rect x="1000" y="197" width="88" height="24" rx="12" fill="#1d2740" stroke="#3c4c6d"/>
    <text class="s" x="1044.0" y="213.5" text-anchor="middle" font-size="11" font-weight="600" fill="#8fb4ff">diproses</text>
    <rect x="416" y="238" width="692" height="42" rx="9" fill="#171d20" stroke="#ffffff" stroke-opacity="0.05"/>
    <text class="s" x="436" y="264" font-size="13.5" fill="#e9efeb">Meja 07</text>
    <text class="s" x="536" y="264" font-size="12.5" fill="#93a09a">4 item</text>
    <text class="s" x="782" y="264" text-anchor="end" font-size="13.5" fill="#dfe7e2">Rp61.000</text>
    <text class="m" x="900" y="264" text-anchor="end" font-size="11" fill="#7d8a84">11:58</text>
    
    <rect x="1000" y="247" width="88" height="24" rx="12" fill="#17301f" stroke="#2f5a3d"/>
    <text class="s" x="1044.0" y="263.5" text-anchor="middle" font-size="11" font-weight="600" fill="#68d99a">selesai</text>
  <text class="m" x="436" y="316" font-size="10.5" fill="#8a968f">ws://0.0.0.0:8080 &#183; 3 pesanan aktif</text>

  <!-- customer phone -->
  <g filter="url(#liftSm)">
    <rect x="72" y="64" width="240" height="272" rx="30" fill="#12171a"/>
    <rect x="80" y="72" width="224" height="256" rx="23" fill="url(#screen)"/>
    <rect x="160" y="80" width="64" height="6" rx="3" fill="#22292c"/>
  </g>
  <text class="s th" x="96" y="122">Meja 05</text>
  <text class="s" x="96" y="141" font-size="11.5" fill="#93a09a">Budi &#183; 3 item</text>
  <line x1="96" y1="154" x2="288" y2="154" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="s" x="96" y="166" font-size="13.5" fill="#dfe7e2">Nasi Goreng &#215;2</text>
    <text class="s" x="288" y="166" text-anchor="end" font-size="13.5" fill="#a9b5af">Rp30.000</text>
    <text class="s" x="96" y="192" font-size="13.5" fill="#dfe7e2">Es Teh &#215;2</text>
    <text class="s" x="288" y="192" text-anchor="end" font-size="13.5" fill="#a9b5af">Rp10.000</text>
    <text class="s" x="96" y="218" font-size="13.5" fill="#dfe7e2">Keripik</text>
    <text class="s" x="288" y="218" text-anchor="end" font-size="13.5" fill="#a9b5af">Rp4.000</text>
  <line x1="96" y1="238" x2="288" y2="238" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="s" x="96" y="262" font-size="12.5" fill="#93a09a">Total</text>
  <text class="s" x="288" y="262" text-anchor="end" font-size="16" font-weight="700" fill="#f3f7f4">Rp44.000</text>
  <rect x="96" y="276" width="192" height="36" rx="10" fill="#27AE60"/>
  <text class="s" x="192" y="299" text-anchor="middle" font-size="13.5" font-weight="700" fill="#06210f">Kirim ke kasir</text>

  <!-- realtime link -->
  <path d="M312 300 C352 300 352 150 396 150" fill="none" stroke="#27AE60" stroke-width="1.6" stroke-dasharray="5 5"/>
  <circle cx="312" cy="300" r="3" fill="#27AE60"/>
  <circle cx="396" cy="150" r="3" fill="#27AE60"/>
  <text class="m" x="332" y="238" font-size="10" fill="#276b47">cart_update</text>

  <text class="s cap" x="64" y="392">pos-app-flutter</text>
  <text class="m capm" x="1136" y="392" text-anchor="end">FLUTTER &#183; NODE.JS &#183; MYSQL</text>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="15" fill="none" stroke="#ddd3bd"/>
</svg>