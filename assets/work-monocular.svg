<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ilustrasi Monocular-Distance-Estimation: bingkai deteksi berlabel jarak dan diagram pinhole">
  <defs>
    <style>
      .mono { font-family: "Courier New", Courier, monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .num  { font-size: 11px; letter-spacing: 3px; fill: #9a8f77; }
      .hdr  { font-size: 11px; letter-spacing: 2px; fill: #9a8f77; }
      .item { font-size: 12.5px; fill: #1b1813; }
      .muted{ font-size: 11.5px; fill: #6b6252; }
      .big  { font-size: 26px; font-weight: 700; fill: #1b1813; }
      .val  { font-size: 12.5px; fill: #2b2519; }
      .chip { font-size: 10.5px; fill: #1f8a4c; }
      .chip2{ font-size: 10.5px; fill: #b45309; }
      .chip3{ font-size: 10.5px; fill: #1d4ed8; }
      .light{ font-size: 12px; fill: #ffffff; }
      .dark { font-size: 12px; fill: #0f1311; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="14" fill="#f6f1e6"/>

  <text class="mono num" x="48" y="48">02 / MONOCULAR DISTANCE</text>

  <!-- camera feed -->
  <rect x="64" y="76" width="560" height="236" rx="14" fill="#101412"/>
  <g stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M92 120 V96 H116"/>
    <path d="M596 96 H620 V120"/>
    <path d="M620 268 V292 H596"/>
    <path d="M116 292 H92 V268"/>
  </g>
  <rect x="240" y="132" width="150" height="150" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="292" y="168" width="46" height="82" rx="6" fill="#1b2420" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="240" y="106" width="92" height="24" fill="#4ade80"/>
  <text class="mono dark" x="252" y="123" font-weight="700">29 cm</text>
  <text class="mono" x="92" y="290" fill="#7d8a84" font-size="11">CAM0 &#183; 640 &#215; 640 &#183; 60 fps</text>

  <!-- pinhole card -->
  <rect x="660" y="76" width="476" height="236" rx="14" fill="#fffdf8" stroke="#d9cfb8"/>
  <text class="mono hdr" x="684" y="104">PINHOLE &#183; SATU KALIBRASI</text>
  <text class="sans big" x="684" y="152">d = (H &#215; f) / h</text>
  <text class="sans val" x="684" y="190">H = 23 cm</text>
  <text class="sans val" x="684" y="216">f = 401.739 px</text>
  <text class="sans val" x="684" y="242">h = 310 px</text>
  <rect x="684" y="256" width="188" height="34" rx="8" fill="#e8f5ec" stroke="#bfe3cd"/>
  <text class="sans" x="702" y="278" font-size="14" font-weight="700" fill="#1f8a4c">d &#8776; 29.8 cm</text>
  <text class="mono" x="892" y="278" fill="#9a8f77" font-size="10.5">f dari focal.txt</text>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="13.5" fill="none" stroke="#ddd3bd"/>
</svg>
