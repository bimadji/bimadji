<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ilustrasi Monocular-Distance-Estimation: bingkai deteksi pada kamera dan panel hitung pinhole">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecdd"/>
      <stop offset="1" stop-color="#e8dfca"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161a"/>
      <stop offset="1" stop-color="#0b0f11"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4a3f2a" flood-opacity="0.22"/>
    </filter>
    <filter id="liftSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4a3f2a" flood-opacity="0.20"/>
    </filter>
    <style>
      .s  { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .m  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .t  { font-size: 14px; fill: #e9efeb; }
      .t2 { font-size: 12px; fill: #93a09a; }
      .th { font-size: 16px; font-weight: 700; fill: #f3f7f4; }
      .col{ font-size: 10.5px; letter-spacing: 1.6px; fill: #7d8a84; }
      .big{ font-size: 30px; font-weight: 700; fill: #f3f7f4; }
      .cap{ font-size: 13.5px; font-weight: 700; fill: #2b2519; }
      .capm{ font-size: 10.5px; letter-spacing: 1.8px; fill: #8a7f68; }
      
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#stage)"/>

  <g filter="url(#lift)">
    <rect x="64" y="64" width="736" height="272" rx="14" fill="#12171a"/>
    <rect x="64" y="64" width="736" height="34" rx="14" fill="#181e21"/>
    <rect x="64" y="86" width="736" height="12" fill="#181e21"/>
    <line x1="64" y1="98" x2="800" y2="98" stroke="#000000" stroke-opacity="0.5"/>
    <circle cx="84" cy="81" r="4.5" fill="#e06c5f"/>
    <circle cx="100" cy="81" r="4.5" fill="#d9a441"/>
    <circle cx="116" cy="81" r="4.5" fill="#4fa86b"/>
    <text class="m" x="134" y="85" font-size="11" fill="#8b969b">inferenceTest &#183; CAM0</text>
    <text class="m" x="780" y="85" font-size="10.5" letter-spacing="1.4" fill="#7d8a84" text-anchor="end">60 FPS</text>
  </g>
  <g>
    <rect x="64" y="98" width="736" height="238" fill="#0a0e0c"/>
    <rect x="64" y="98" width="736" height="116" fill="#0e1512"/>
    <line x1="64" y1="214" x2="800" y2="214" stroke="#1f2e26" stroke-width="1.2"/>
    <g opacity="0.85">
    <line x1="432" y1="214" x2="64" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="169" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="274" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="379" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="484" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="589" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="694" y2="336" stroke="#2a3a32" stroke-width="1"/>
    <line x1="432" y1="214" x2="799" y2="336" stroke="#2a3a32" stroke-width="1"/>
    </g>
    <ellipse cx="424" cy="262" rx="54" ry="7" fill="#000000" opacity="0.45"/>
    <rect x="402" y="158" width="48" height="104" rx="7" fill="#1b2521" stroke="#3a4d43" stroke-width="1.5"/>
    <rect x="407" y="166" width="38" height="88" rx="3" fill="#111a16"/>
    <rect x="390" y="146" width="72" height="124" fill="none" stroke="#4ade80" stroke-width="2"/>
    <g stroke="#4ade80" stroke-width="3.5" stroke-linecap="square">
      <path d="M390 158 V146 H402"/>
      <path d="M450 146 H462 V158"/>
      <path d="M462 258 V270 H450"/>
      <path d="M402 270 H390 V258"/>
    </g>
    <rect x="390" y="120" width="78" height="22" rx="4" fill="#4ade80"/>
    <text class="s" x="402" y="136" font-size="13" font-weight="700" fill="#08120c">29 cm</text>
    <g stroke="#4ade80" stroke-width="1.3">
      <line x1="486" y1="146" x2="486" y2="270"/>
      <line x1="481" y1="146" x2="491" y2="146"/>
      <line x1="481" y1="270" x2="491" y2="270"/>
    </g>
    <text class="m" x="498" y="212" font-size="10.5" fill="#7fbf98">310 px</text>
    <text class="m" x="88" y="318" font-size="10.5" fill="#8a968f">CAM0 &#183; 640&#215;640 &#183; MJPG &#183; 60 fps</text>
    <text class="m" x="776" y="318" font-size="10.5" fill="#8a968f" text-anchor="end">conf 0.87</text>
  </g>

  <!-- math panel -->
  <g filter="url(#liftSm)">
    <rect x="816" y="64" width="320" height="272" rx="14" fill="#12171a"/>
  </g>
  <text class="m" x="840" y="104" font-size="10.5" letter-spacing="1.6" fill="#7d8a84">PINHOLE &#183; SATU KALIBRASI</text>
  <text class="s big" x="840" y="148">d = (H &#215; f) / h</text>
  <line x1="840" y1="166" x2="1112" y2="166" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="s" x="840" y="194" font-size="12.5" fill="#93a09a">H</text>
  <text class="m" x="1112" y="194" text-anchor="end" font-size="12.5" fill="#e9efeb">23 cm</text>
  <text class="s" x="840" y="222" font-size="12.5" fill="#93a09a">f</text>
  <text class="m" x="1112" y="222" text-anchor="end" font-size="12.5" fill="#e9efeb">401.739 px</text>
  <text class="s" x="840" y="250" font-size="12.5" fill="#93a09a">h</text>
  <text class="m" x="1112" y="250" text-anchor="end" font-size="12.5" fill="#e9efeb">310 px</text>
  <line x1="840" y1="264" x2="1112" y2="264" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="s" x="840" y="292" font-size="18" font-weight="700" fill="#4ade80">d &#8776; 29.8 cm</text>
  <text class="m" x="840" y="314" font-size="10" fill="#8a968f">f dibaca dari focal.txt</text>

  <text class="s cap" x="64" y="392">Monocular-Distance-Estimation---YoloV8</text>
  <text class="m capm" x="1136" y="392" text-anchor="end">C++ &#183; OPENCV &#183; YOLOV8</text>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="15" fill="none" stroke="#ddd3bd"/>
</svg>