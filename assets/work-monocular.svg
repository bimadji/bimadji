<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ilustrasi Monocular-Distance-Estimation: bingkai deteksi pada kamera dan panel hitung pinhole">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061519"/>
      <stop offset="52%" stop-color="#0B2429"/>
      <stop offset="100%" stop-color="#051216"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D2329"/>
      <stop offset="100%" stop-color="#08171B"/>
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02080A" flood-opacity="0.52"/>
    </filter>
    <filter id="liftSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02080A" flood-opacity="0.48"/>
    </filter>
    <style>
      .s   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .m   { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .big { font-size: 30px; font-weight: 700; fill: #ECFDF5; }
      .cap { font-size: 13.5px; font-weight: 700; fill: #ECFDF5; }
      .capm{ font-size: 10.5px; letter-spacing: 1.8px; fill: #67A8A1; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#stage)"/>
  <ellipse cx="880" cy="210" rx="300" ry="160" fill="url(#auroraGlow)"/>

  <g filter="url(#lift)">
    <rect x="64" y="64" width="736" height="272" rx="14" fill="url(#screen)" stroke="#2DD4BF" stroke-opacity="0.22"/>
    <rect x="64" y="64" width="736" height="34" rx="14" fill="#102B31"/>
    <rect x="64" y="86" width="736" height="12" fill="#102B31"/>
    <line x1="64" y1="98" x2="800" y2="98" stroke="#2DD4BF" stroke-opacity="0.16"/>
    <circle cx="84" cy="81" r="4.5" fill="#0F766E"/>
    <circle cx="100" cy="81" r="4.5" fill="#14B8A6"/>
    <circle cx="116" cy="81" r="4.5" fill="#5EEAD4"/>
    <text class="m" x="134" y="85" font-size="11" fill="#88B8B2">inferenceTest &#183; CAM0</text>
    <text class="m" x="780" y="85" font-size="10.5" letter-spacing="1.4" fill="#5EEAD4" text-anchor="end">60 FPS</text>
  </g>

  <g>
    <rect x="65" y="98" width="734" height="237" rx="12" fill="#051013"/>
    <rect x="65" y="98" width="734" height="116" fill="#081A1E"/>
    <line x1="65" y1="214" x2="799" y2="214" stroke="#163A40" stroke-width="1.2"/>
    <g opacity="0.85">
      <line x1="432" y1="214" x2="65" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="169" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="274" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="379" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="484" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="589" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="694" y2="335" stroke="#133339" stroke-width="1"/>
      <line x1="432" y1="214" x2="798" y2="335" stroke="#133339" stroke-width="1"/>
    </g>
    <ellipse cx="424" cy="262" rx="54" ry="7" fill="#000000" opacity="0.48"/>
    <rect x="402" y="158" width="48" height="104" rx="7" fill="#102C32" stroke="#285E68" stroke-width="1.5"/>
    <rect x="407" y="166" width="38" height="88" rx="3" fill="#081A1E"/>
    <rect x="390" y="146" width="72" height="124" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <g stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="square">
      <path d="M390 158 V146 H402"/>
      <path d="M450 146 H462 V158"/>
      <path d="M462 258 V270 H450"/>
      <path d="M402 270 H390 V258"/>
    </g>
    <rect x="390" y="120" width="78" height="22" rx="4" fill="#2DD4BF"/>
    <text class="s" x="402" y="136" font-size="13" font-weight="700" fill="#042422">29 cm</text>
    <g stroke="#2DD4BF" stroke-width="1.3">
      <line x1="486" y1="146" x2="486" y2="270"/>
      <line x1="481" y1="146" x2="491" y2="146"/>
      <line x1="481" y1="270" x2="491" y2="270"/>
    </g>
    <text class="m" x="498" y="212" font-size="10.5" fill="#5EEAD4">310 px</text>
    <text class="m" x="88" y="318" font-size="10.5" fill="#88B8B2">CAM0 &#183; 640&#215;640 &#183; MJPG &#183; 60 fps</text>
    <text class="m" x="776" y="318" font-size="10.5" fill="#88B8B2" text-anchor="end">conf 0.87</text>
  </g>

  <!-- math panel -->
  <g filter="url(#liftSm)">
    <rect x="816" y="64" width="320" height="272" rx="14" fill="url(#screen)" stroke="#2DD4BF" stroke-opacity="0.22"/>
  </g>
  <text class="m" x="840" y="104" font-size="10.5" letter-spacing="1.6" fill="#5EEAD4">PINHOLE &#183; SATU KALIBRASI</text>
  <text class="s big" x="840" y="148">d = (H &#215; f) / h</text>
  <line x1="840" y1="166" x2="1112" y2="166" stroke="#5EEAD4" stroke-opacity="0.14"/>
  <text class="s" x="840" y="194" font-size="12.5" fill="#88B8B2">H</text>
  <text class="m" x="1112" y="194" text-anchor="end" font-size="12.5" fill="#ECFDF5">23 cm</text>
  <text class="s" x="840" y="222" font-size="12.5" fill="#88B8B2">f</text>
  <text class="m" x="1112" y="222" text-anchor="end" font-size="12.5" fill="#ECFDF5">401.739 px</text>
  <text class="s" x="840" y="250" font-size="12.5" fill="#88B8B2">h</text>
  <text class="m" x="1112" y="250" text-anchor="end" font-size="12.5" fill="#ECFDF5">310 px</text>
  <line x1="840" y1="264" x2="1112" y2="264" stroke="#5EEAD4" stroke-opacity="0.14"/>
  <text class="s" x="840" y="292" font-size="18" font-weight="700" fill="#5EEAD4">d &#8776; 29.8 cm</text>
  <text class="m" x="840" y="314" font-size="10" fill="#88B8B2">f dibaca dari focal.txt</text>

  <text class="s cap" x="64" y="390">Monocular-Distance-Estimation---YoloV8</text>
  <text class="m capm" x="1136" y="390" text-anchor="end">C++ &#183; OPENCV &#183; YOLOV8</text>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#2DD4BF" stroke-opacity="0.38"/>
</svg>
