<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ilustrasi LabManage: jadwal mingguan lab dan inventaris komponen dengan permintaan pinjam">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecdd"/>
      <stop offset="1" stop-color="#e8dfca"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1417"/>
      <stop offset="1" stop-color="#0b0f11"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4a3f2a" flood-opacity="0.22"/>
    </filter>
    <style>
      .s  { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .m  { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .cap{ font-size: 13.5px; font-weight: 700; fill: #2b2519; }
      .capm{ font-size: 10.5px; letter-spacing: 1.8px; fill: #6f6753; }
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#stage)"/>

  <!-- window -->
  <g filter="url(#lift)">
    <rect x="64" y="64" width="1072" height="272" rx="14" fill="#12171a"/>
    <rect x="64" y="64" width="1072" height="34" rx="14" fill="#181e21"/>
    <rect x="64" y="86" width="1072" height="12" fill="#181e21"/>
    <line x1="64" y1="98" x2="1136" y2="98" stroke="#000000" stroke-opacity="0.5"/>
    <circle cx="84" cy="81" r="4.5" fill="#e06c5f"/>
    <circle cx="100" cy="81" r="4.5" fill="#d9a441"/>
    <circle cx="116" cy="81" r="4.5" fill="#4fa86b"/>
    <text class="m" x="134" y="85" font-size="11" fill="#8b969b">labmanage &#183; jadwal</text>
    <rect x="1068" y="70" width="52" height="20" rx="10" fill="#17301f" stroke="#2f5a3d"/>
    <text class="m" x="1094" y="84" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#4ade80">LIVE</text>
  </g>

  <!-- schedule head -->
  <text class="m" x="88" y="126" font-size="10.5" letter-spacing="1.6" fill="#8a968f">JADWAL LAB</text>
  <text class="s" x="88" y="146" font-size="12.5" fill="#e9efeb">Minggu ini</text>

  <text class="m" x="184" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">SEN</text>
  <text class="m" x="262" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">SEL</text>
  <text class="m" x="340" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">RAB</text>
  <text class="m" x="418" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">KAM</text>
  <text class="m" x="496" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">JUM</text>
  <text class="m" x="574" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">SAB</text>
  <text class="m" x="652" y="146" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8a968f">MIN</text>

  <text class="m" x="128" y="176" text-anchor="end" font-size="10" fill="#8a968f">08:00</text>
