  <circle cx="760" cy="300" r="4" fill="#f2c078"/>
  <text class="s" x="772" y="304" font-size="11" fill="#e9efeb">Pinjam Servo</text>
  <text class="s" x="856" y="304" font-size="10.5" fill="#8a968f">menunggu ACC</text>
  <rect x="1032" y="291" width="64" height="18" rx="9" fill="#27AE60"/>
  <text class="s" x="1064" y="304" text-anchor="middle" font-size="10" font-weight="700" fill="#06210f">Setuju</text>

  <text class="s cap" x="64" y="392">LabManage</text>
  <text class="m capm" x="1136" y="392" text-anchor="end">REACT &#183; EXPRESS &#183; SUPABASE</text>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15" fill="none" stroke="#ddd3bd"/>
