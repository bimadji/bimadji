  <rect x="148" y="248" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>

  <rect x="226" y="152" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
