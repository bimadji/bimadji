  <rect x="96" y="330" width="12" height="12" rx="3" fill="#27AE60" opacity="0.45"/>
  <text class="s" x="116" y="340" font-size="11.5" fill="#6b6252">dipesan</text>
  <rect x="192" y="330" width="12" height="12" rx="3" fill="#d9a441" opacity="0.5"/>
  <text class="s" x="212" y="340" font-size="11.5" fill="#6b6252">menunggu ACC</text>
  <text class="s" x="540" y="340" text-anchor="end" font-size="11.5" fill="#6b6252">9 sesi terisi &#183; 2 menunggu</text>


