  <rect x="226" y="248" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>

  <rect x="304" y="152" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>
  <rect x="304" y="200" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="304" y="248" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>

  <rect x="382" y="152" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="382" y="200" width="72" height="36" rx="6" fill="#3b2f1c" stroke="#6b5527" stroke-dasharray="3 3"/>
  <rect x="382" y="248" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>

  <rect x="460" y="152" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="460" y="200" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>
  <rect x="460" y="248" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>

  <rect x="538" y="152" width="72" height="36" rx="6" fill="#3b2f1c" stroke="#6b5527" stroke-dasharray="3 3"/>
  <rect x="538" y="200" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="538" y="248" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>

  <rect x="616" y="152" width="72" height="36" rx="6" fill="#17301f" stroke="#2f5a3d"/>
  <rect x="616" y="200" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="616" y="248" width="72" height="36" rx="6" fill="#151b1e" stroke="#ffffff" stroke-opacity="0.05"/>

