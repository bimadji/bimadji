  <text class="s" x="105" y="307" font-size="10.5" fill="#8a968f">terisi</text>
  <rect x="158" y="298" width="10" height="10" rx="2" fill="#3b2f1c" stroke="#6b5527" stroke-dasharray="2 2"/>
  <text class="s" x="175" y="307" font-size="10.5" fill="#8a968f">menunggu ACC</text>

