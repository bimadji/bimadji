  <text class="s" x="744" y="180" font-size="13" fill="#e9efeb">Servo MG996R</text>
  <text class="m" x="1112" y="180" text-anchor="end" font-size="10.5" fill="#93a09a">12 / 20</text>
  <rect x="744" y="190" width="368" height="6" rx="3" fill="#222a2d"/>
  <rect x="744" y="190" width="221" height="6" rx="3" fill="#68d99a" opacity="0.85"/>

  <text class="s" x="744" y="222" font-size="13" fill="#e9efeb">Bearing 608</text>
  <text class="m" x="1112" y="222" text-anchor="end" font-size="10.5" fill="#f2c078">4 / 14</text>
  <rect x="744" y="232" width="368" height="6" rx="3" fill="#222a2d"/>
  <rect x="744" y="232" width="105" height="6" rx="3" fill="#f2c078" opacity="0.85"/>

