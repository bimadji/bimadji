  <g filter="url(#liftSm)">
    <rect x="664" y="300" width="448" height="46" rx="9" fill="#fffdf8" stroke="#d9cfb8"/>
  </g>
  <circle cx="686" cy="323" r="7" fill="#f2c078" opacity="0.45"/>
  <circle cx="686" cy="323" r="3" fill="#b58128"/>
  <text class="s" x="702" y="319" font-size="12" fill="#2b2519">Pinjam 2 Servo MG996R</text>
