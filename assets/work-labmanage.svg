<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ilustrasi LabManage: jadwal mingguan lab dan inventaris komponen dengan permintaan pinjam">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecdd"/>
      <stop offset="1" stop-color="#e8dfca"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4a3f2a" flood-opacity="0.22"/>
    </filter>
    <filter id="liftSm" x="-30%" y="-30%" width="160%" y2="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4a3f2a" flood-opacity="0.18"/>
    </filter>
    <style>
      .s  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m  { font-family: "SFMono-Regular", Menlo, "Courier New", monospace; }
      .cap{ font-size: 13.5px; font-weight: 700; fill: #2b2519; }
      .capm{ font-size: 10.5px; letter-spacing: 1.8px; fill: #6f6753; }
      .col{ font-size: 10.5px; letter-spacing: 1.6px; fill: #9a8f77; }
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#stage)"/>

  <!-- schedule card -->
  <g filter="url(#lift)">
    <rect x="64" y="72" width="520" height="288" rx="14" fill="#fffdf8" stroke="#e2d9c4"/>
  </g>
