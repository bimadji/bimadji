<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ilustrasi LabManage: jadwal mingguan lab dan inventaris komponen dengan permintaan pinjam">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061519"/>
      <stop offset="52%" stop-color="#0B2429"/>
      <stop offset="100%" stop-color="#051216"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D2329"/>
      <stop offset="100%" stop-color="#08171B"/>
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02080A" flood-opacity="0.52"/>
    </filter>
    <style>
      .s   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .m   { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .cap { font-size: 13.5px; font-weight: 700; fill: #ECFDF5; }
      .capm{ font-size: 10.5px; letter-spacing: 1.8px; fill: #67A8A1; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#stage)"/>
  <ellipse cx="420" cy="210" rx="360" ry="170" fill="url(#auroraGlow)"/>

  <!-- window -->
